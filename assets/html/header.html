<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    font-family: "Hanken Grotesk", system-ui, sans-serif;
    background: #F5F1E7; color: #1E1D1A; position: relative; overflow: hidden;
  }
  .toprule { position: absolute; top: 0; left: 0; right: 0; height: 5px;
    background: linear-gradient(90deg, #1F6E5B, #5FBBA1 60%, rgba(95,187,161,0)); }
  .grid { height: 100%; display: grid; grid-template-columns: 1.05fr .95fr; align-items: center; gap: 40px; padding: 0 72px; }

  .eyebrow { font-family: "JetBrains Mono", monospace; font-size: 14px; letter-spacing: .2em;
    text-transform: uppercase; color: #6B665B; }
  h1 { font-family: "Fraunces", Georgia, serif; font-weight: 600; font-size: 60px; line-height: 1.02;
    letter-spacing: -.015em; margin-top: 20px; color: #1E1D1A; }
  .sub { margin-top: 20px; font-size: 23px; line-height: 1.4; color: #55503f; max-width: 20em; }
  .sub b { color: #1E1D1A; font-weight: 600; }
  .pills { margin-top: 28px; display: flex; gap: 10px; }
  .pill { display: inline-flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; color: #3a362d;
    background: #FBF8F1; border: 1px solid #E1D9C7; padding: 8px 15px; border-radius: 999px; }
  .pill .d { width: 9px; height: 9px; border-radius: 50%; }

  .stage { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .card { background: #FBF8F1; border: 1px solid #E1D9C7; border-radius: 16px; padding: 16px 20px;
    box-shadow: 0 14px 34px rgba(30,29,26,.09); width: 340px; }
  .card .lbl { font-family: "JetBrains Mono", monospace; font-size: 11px; letter-spacing: .16em;
    text-transform: uppercase; color: #8a8474; }
  .card .prompt { font-family: "JetBrains Mono", monospace; font-size: 20px; color: #1E1D1A; margin-top: 8px; }
  .arrow { color: #1F6E5B; font-size: 22px; line-height: 1; }
  .card.result { display: flex; flex-direction: column; gap: 12px; }
  .row { display: flex; align-items: center; gap: 12px; font-size: 16.5px; color: #2b2822; }
  .tick { flex: 0 0 auto; width: 22px; height: 22px; border-radius: 50%; background: #E6EFEA;
    border: 1px solid #bcd8ce; display: flex; align-items: center; justify-content: center; }
  .wave { margin-top: 20px; display: flex; align-items: flex-end; gap: 5px; height: 40px; }
  .wave i { width: 6px; border-radius: 3px; background: #cdc6b4; }
</style>
</head>
<body>
  <div class="toprule"></div>
  <div class="grid">
    <div class="left">
      <div class="eyebrow">Studio control · obs-websocket v5</div>
      <h1>OBS Natural-<br>Language Tuner</h1>
      <p class="sub">Describe what you want. <b>Claude</b> or <b>ChatGPT</b> tunes OBS Studio for you.</p>
      <div class="pills">
        <span class="pill"><span class="d" style="background:#C2603E"></span>Claude</span>
        <span class="pill"><span class="d" style="background:#2E9E7C"></span>ChatGPT</span>
      </div>
    </div>

    <div class="right">
      <div class="stage">
        <div class="card">
          <div class="lbl">you type</div>
          <div class="prompt">"clean up my mic"</div>
        </div>
        <div class="arrow">↓</div>
        <div class="card result">
          <div class="row">
            <span class="tick"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M2 6.5 L5 9 L10 3" stroke="#1F6E5B" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
            Noise Suppression · Gate · EQ
          </div>
          <div class="row">
            <span class="tick"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M2 6.5 L5 9 L10 3" stroke="#1F6E5B" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
            Output 1920×1080 · 60 fps
          </div>
          <div class="wave" id="wave"></div>
        </div>
      </div>
    </div>
  </div>
  <script>
    // build a tidy waveform; a few teal accent bars
    const heights = [10,18,26,14,32,22,30,12,24,18,12,20,28,16,22];
    const w = document.getElementById('wave');
    heights.forEach((h,i) => {
      const b = document.createElement('i');
      b.style.height = h + 'px';
      if (i===4 || i===6 || i===12) b.style.background = '#1F6E5B';
      w.appendChild(b);
    });
  </script>
</body>
</html>
